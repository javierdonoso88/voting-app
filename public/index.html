<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vota tu presentación favorita</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --c1: #0f172a;
      --c2: #1e293b;
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --accent3: #06b6d4;
      --gold: #f59e0b;
      --green: #10b981;
      --white: #ffffff;
      --muted: #94a3b8;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.08);
      --glow: rgba(99,102,241,0.3);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--c1);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(99,102,241,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139,92,246,0.12) 0%, transparent 50%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(6,182,212,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: relative;
      z-index: 1;
      padding: 48px 24px 40px;
      text-align: center;
    }

    .header-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a5b4fc;
      margin-bottom: 24px;
    }
    .header-tag .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6366f1;
      animation: livepulse 1.4s ease-in-out infinite;
    }
    @keyframes livepulse {
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:0.4;transform:scale(1.4)}
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1.05;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #67e8f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    header p {
      font-size: 1.05rem;
      color: var(--muted);
      font-weight: 400;
    }

    .votes-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 8px 20px;
      font-size: 0.88rem;
      color: var(--muted);
      transition: all 0.3s;
    }
    .votes-pill strong { color: white; font-weight: 700; font-size: 1rem; }

    /* Grid */
    main {
      position: relative;
      z-index: 1;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    /* Cards */
    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 24px 24px;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), border-color 0.22s, box-shadow 0.22s;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: radial-gradient(circle at 50% 0%, rgba(99,102,241,0.12) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover:not(.disabled)::before { opacity: 1; }
    .card:hover:not(.disabled) {
      transform: translateY(-6px) scale(1.01);
      border-color: rgba(99,102,241,0.5);
      box-shadow:
        0 20px 40px rgba(0,0,0,0.3),
        0 0 0 1px rgba(99,102,241,0.2),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .card.selected {
      border-color: var(--accent);
      background: rgba(99,102,241,0.12);
      box-shadow:
        0 16px 40px rgba(99,102,241,0.25),
        0 0 0 1px rgba(99,102,241,0.4),
        inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .card.selected::before { opacity: 1; }
    .card.disabled { cursor: default; opacity: 0.4; pointer-events: none; }

    /* Shimmer on hover */
    .card::after {
      content: '';
      position: absolute;
      top: -100%;
      left: -60%;
      width: 60%;
      height: 300%;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.06) 50%, transparent 60%);
      transition: left 0.6s ease;
      pointer-events: none;
    }
    .card:hover:not(.disabled)::after { left: 140%; }

    .card-emoji {
      font-size: 2.4rem;
      margin-bottom: 14px;
      display: block;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: white;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .card-divider {
      width: 32px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      border-radius: 2px;
      margin-bottom: 10px;
      transition: width 0.3s;
    }
    .card:hover:not(.disabled) .card-divider { width: 48px; }
    .card.selected .card-divider { width: 48px; }

    .card-author { font-size: 0.88rem; font-weight: 600; color: #e2e8f0; }
    .card-role   { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }

    .voted-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 100px;
      padding: 3px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: white;
      box-shadow: 0 2px 8px rgba(99,102,241,0.4);
    }

    /* Voted message */
    .voted-msg {
      display: none;
      max-width: 520px;
      margin: 60px auto;
      text-align: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 48px 36px;
      backdrop-filter: blur(20px);
    }

    .voted-msg .check-ring {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(16,185,129,0.05));
      border: 2px solid rgba(16,185,129,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 24px;
      animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .voted-msg h2 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      color: var(--green);
    }
    .voted-msg p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; }

    .vote-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 16px;
      padding: 14px 20px;
      font-weight: 700;
      color: #a5b4fc;
      font-size: 1rem;
      letter-spacing: -0.2px;
    }

    .waiting-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .waiting-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: dotbounce 1.2s ease-in-out infinite;
    }
    .waiting-dots span:nth-child(2) { animation-delay: 0.2s; }
    .waiting-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotbounce {
      0%,80%,100%{transform:translateY(0)}
      40%{transform:translateY(-6px)}
    }

    /* REVEAL OVERLAY */
    #revealOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--c1);
      z-index: 100;
      overflow-y: auto;
    }
    #revealOverlay::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(99,102,241,0.2) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 80% 100%, rgba(139,92,246,0.15) 0%, transparent 50%);
      pointer-events: none;
    }

    .reveal-inner {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 52px 20px 60px;
    }

    .reveal-header { text-align: center; margin-bottom: 48px; }
    .reveal-header .trophy { font-size: 3.5rem; display: block; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .reveal-header h2 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 900;
      letter-spacing: -1.5px;
      background: linear-gradient(135deg, #ffffff, #a5b4fc, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .reveal-header p { color: var(--muted); margin-top: 8px; }

    .results-list { display: flex; flex-direction: column; gap: 12px; }

    .result-row {
      position: relative;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      backdrop-filter: blur(12px);
    }
    .result-row.show { opacity: 1; transform: translateY(0); }
    .result-row.winner {
      background: rgba(99,102,241,0.12);
      border-color: rgba(99,102,241,0.35);
      box-shadow: 0 8px 32px rgba(99,102,241,0.2), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .result-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, rgba(99,102,241,0.12), transparent);
      transition: width 1.2s cubic-bezier(.22,1,.36,1);
      width: 0;
      pointer-events: none;
    }
    .result-row.winner .result-bar {
      background: linear-gradient(90deg, rgba(99,102,241,0.2), transparent);
    }

    .result-rank {
      font-size: 1.5rem;
      min-width: 36px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .result-info { flex: 1; position: relative; z-index: 1; }
    .result-info .rt { font-size: 0.98rem; font-weight: 700; color: white; letter-spacing: -0.2px; }
    .result-info .ra { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }

    .result-score {
      position: relative;
      z-index: 1;
      text-align: right;
    }
    .result-score .num {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: white;
    }
    .result-score .lbl { font-size: 0.7rem; color: var(--muted); margin-top: 1px; text-transform: uppercase; letter-spacing: 0.06em; }
    .result-row.winner .result-score .num {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .result-pct-bar {
      position: relative;
      z-index: 1;
      width: 100px;
    }
    .result-pct-bg {
      height: 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .result-pct-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      transition: width 1.2s cubic-bezier(.22,1,.36,1);
      width: 0;
    }
    .result-row.winner .result-pct-fill {
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
    }
    .result-pct-lbl { font-size: 0.72rem; color: var(--muted); margin-top: 4px; text-align: right; }

    /* Confetti */
    #confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
  </style>
</head>
<body>
  <header>
    <div class="header-tag"><span class="dot"></span> Votación en directo</div>
    <h1>Casos de IA<br>en vuestro dÍA a dÍA</h1>
    <p>Selecciona tu presentación favorita</p>
    <div class="votes-pill">
      <strong id="totalVotes">0</strong> votos registrados
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="voted-msg" id="votedMsg">
      <div class="check-ring">✓</div>
      <h2>¡Voto registrado!</h2>
      <p>Gracias por participar.<br>Los resultados se revelarán al final.</p>
      <div class="vote-chip">
        <span id="selectedEmoji"></span>
        <span id="selectedTitle"></span>
      </div>
      <div class="waiting-dots">
        <span></span><span></span><span></span>
        &nbsp;Esperando resultados
      </div>
    </div>
  </main>

  <div id="revealOverlay">
    <div class="reveal-inner">
      <div class="reveal-header">
        <span class="trophy">🏆</span>
        <h2>Resultados Finales</h2>
        <p>Gracias a todos por participar</p>
      </div>
      <div class="results-list" id="resultsList"></div>
    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script>
    const socket = io();
    let presentations = [];
    let hasVoted = false;
    let myVoteId = null;
    const SESSION_KEY = 'voting_v2_' + window.location.host;

    function getOrCreateSession() {
      let s = localStorage.getItem(SESSION_KEY);
      if (!s) {
        s = 'u_' + Math.random().toString(36).substr(2, 14) + Date.now().toString(36);
        localStorage.setItem(SESSION_KEY, s);
      }
      return s;
    }
    const sessionId = getOrCreateSession();

    socket.on('state', (data) => {
      presentations = data.presentations;
      document.getElementById('totalVotes').textContent = data.totalVotes;
      const storedVote = localStorage.getItem(SESSION_KEY + '_voted');
      if (storedVote) { hasVoted = true; myVoteId = parseInt(storedVote); }
      renderGrid();
      if (storedVote) showVotedMessage(myVoteId);
      if (data.revealed) showReveal(data.counts, presentations);
    });

    socket.on('voteUpdate', ({ totalVotes }) => {
      document.getElementById('totalVotes').textContent = totalVotes;
    });

    socket.on('votedOk', ({ presentationId }) => {
      localStorage.setItem(SESSION_KEY + '_voted', presentationId);
      hasVoted = true; myVoteId = presentationId;
      showVotedMessage(presentationId);
    });

    socket.on('alreadyVoted', () => {
      const s = localStorage.getItem(SESSION_KEY + '_voted');
      if (s) { hasVoted = true; myVoteId = parseInt(s); showVotedMessage(myVoteId); }
    });

    socket.on('reveal', ({ counts, presentations: p }) => showReveal(counts, p));

    socket.on('reset', () => {
      localStorage.removeItem(SESSION_KEY + '_voted');
      hasVoted = false; myVoteId = null;
      document.getElementById('totalVotes').textContent = '0';
      document.getElementById('revealOverlay').style.display = 'none';
      document.getElementById('votedMsg').style.display = 'none';
      document.getElementById('grid').style.display = '';
      renderGrid();
    });

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      presentations.forEach((p, i) => {
        const isSelected = myVoteId === p.id;
        const card = document.createElement('div');
        card.className = 'card' + (hasVoted && !isSelected ? ' disabled' : '') + (isSelected ? ' selected' : '');
        card.style.animationDelay = (i * 60) + 'ms';
        card.innerHTML = `
          <span class="card-emoji">${p.emoji}</span>
          <div class="card-title">${p.title}</div>
          <div class="card-divider"></div>
          <div class="card-author">${p.author}</div>
          <div class="card-role">${p.role}</div>
          ${isSelected ? '<div class="voted-badge">Tu voto ✓</div>' : ''}
        `;
        if (!hasVoted) card.addEventListener('click', () => socket.emit('vote', { presentationId: p.id, sessionId }));
        grid.appendChild(card);
      });
    }

    function showVotedMessage(id) {
      const p = presentations.find(x => x.id === id);
      document.getElementById('grid').style.display = 'none';
      document.getElementById('votedMsg').style.display = 'block';
      if (p) {
        document.getElementById('selectedEmoji').textContent = p.emoji;
        document.getElementById('selectedTitle').textContent = p.title + ' — ' + p.author;
      }
    }

    function showReveal(counts, presos) {
      document.getElementById('revealOverlay').style.display = 'block';
      document.getElementById('grid').style.display = 'none';
      const sorted = [...presos].sort((a,b) => (counts[b.id]||0) - (counts[a.id]||0));
      const maxV = Math.max(...sorted.map(p => counts[p.id] || 0), 1);
      const total = sorted.reduce((s,p) => s + (counts[p.id]||0), 0);
      const list = document.getElementById('resultsList');
      list.innerHTML = '';
      const ranks = ['🥇','🥈','🥉'];
      sorted.forEach((p, idx) => {
        const v = counts[p.id] || 0;
        const pct = total > 0 ? Math.round((v / total) * 100) : 0;
        const barPct = Math.round((v / maxV) * 100);
        const row = document.createElement('div');
        row.className = 'result-row' + (idx === 0 ? ' winner' : '');
        row.innerHTML = `
          <div class="result-bar" id="rbar-${p.id}"></div>
          <div class="result-rank">${ranks[idx] || (idx + 1)}</div>
          <div class="result-info">
            <div class="rt">${p.emoji} ${p.title}</div>
            <div class="ra">${p.author} · ${p.role}</div>
          </div>
          <div class="result-pct-bar">
            <div class="result-pct-bg"><div class="result-pct-fill" id="pctfill-${p.id}"></div></div>
            <div class="result-pct-lbl">${pct}%</div>
          </div>
          <div class="result-score">
            <div class="num">${v}</div>
            <div class="lbl">${v === 1 ? 'voto' : 'votos'}</div>
          </div>
        `;
        list.appendChild(row);
        setTimeout(() => {
          row.classList.add('show');
          setTimeout(() => {
            document.getElementById('rbar-' + p.id).style.width = barPct + '%';
            document.getElementById('pctfill-' + p.id).style.width = '100%';
          }, 150);
        }, idx * 120);
      });
      if (sorted[0] && (counts[sorted[0].id] || 0) > 0) {
        setTimeout(launchConfetti, sorted.length * 120 + 600);
      }
    }

    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ['#6366f1','#8b5cf6','#06b6d4','#f59e0b','#10b981','#f472b6','#fff'];
      const pieces = Array.from({ length: 150 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 100,
        r: Math.random() * 6 + 3,
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 4 + 2,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.15,
        color: colors[Math.floor(Math.random() * colors.length)],
        w: Math.random() * 10 + 6,
        h: Math.random() * 5 + 3,
      }));
      let frame = 0;
      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pieces.forEach(p => {
          p.y += p.vy;
          p.x += p.vx + Math.sin(frame * 0.02 + p.r) * 0.5;
          p.rot += p.rotV;
          if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = 0.85;
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
          ctx.restore();
        });
        frame++;
        if (frame < 350) requestAnimationFrame(draw);
        else { ctx.clearRect(0,0,canvas.width,canvas.height); }
      }
      draw();
    }
  </script>
</body>
</html>
