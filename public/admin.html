<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Panel de Votación</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --c1: #0f172a;
      --c2: #1e293b;
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --accent3: #06b6d4;
      --gold: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --white: #ffffff;
      --muted: #94a3b8;
      --border: rgba(255,255,255,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--c1);
      color: var(--white);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 40% at 20% 0%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 30% at 80% 100%, rgba(139,92,246,0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      padding: 20px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    header .brand { display: flex; align-items: center; gap: 12px; }
    header .brand .icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    header .brand h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.3px; }
    header .brand p  { font-size: 0.75rem; color: var(--muted); }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #34d399;
    }
    .live-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #10b981;
      animation: livepulse 1.4s ease-in-out infinite;
    }
    @keyframes livepulse { 0%,100%{opacity:1}50%{opacity:0.3} }

    main {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* Auth */
    .auth-row {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .auth-row label { font-size: 0.82rem; color: var(--muted); font-weight: 500; white-space: nowrap; }
    .auth-row input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 14px;
      color: white;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .auth-row input:focus { border-color: rgba(99,102,241,0.5); }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .stat-card .n {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(135deg, white, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-card .l { font-size: 0.75rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; }

    /* Results table */
    .table-wrap {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 28px;
    }
    .table-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .table-head h3 { font-size: 0.9rem; font-weight: 600; }
    .table-head span { font-size: 0.75rem; color: var(--muted); }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: rgba(255,255,255,0.03); }
    .row .em { font-size: 1.4rem; }
    .row .info { flex: 1; }
    .row .info .t { font-size: 0.9rem; font-weight: 600; }
    .row .info .a { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .row .bar-wrap { width: 160px; }
    .row .bar-bg { height: 6px; border-radius: 4px; background: rgba(255,255,255,0.07); overflow: hidden; }
    .row .bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent3)); transition: width 0.5s ease; }
    .row .vnum { min-width: 36px; text-align: right; font-weight: 800; font-size: 1.1rem; color: white; }

    /* Actions */
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.12s;
    }
    button:hover { opacity: 0.85; transform: translateY(-1px); }
    button:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-size: 1rem;
      padding: 14px 28px;
      box-shadow: 0 4px 16px rgba(99,102,241,0.35);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--muted);
    }
    .btn-danger {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
    }

    /* Log */
    .log-wrap { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .log-head { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 0.75rem; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .log {
      padding: 12px 16px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.78rem;
      color: #4ade80;
      max-height: 130px;
      overflow-y: auto;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="icon">⚙️</div>
      <div>
        <h1>Panel de Administración</h1>
        <p>Votación — Casos de IA en vuestro dÍA a dÍA</p>
      </div>
    </div>
    <div class="live-badge"><span class="dot"></span> En directo</div>
  </header>

  <main>
    <div class="auth-row">
      <label>🔑 Clave admin</label>
      <input type="password" id="adminKey" value="admin2024" placeholder="Clave de administrador" />
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="n" id="totalVotes">0</div><div class="l">Votos totales</div></div>
      <div class="stat-card"><div class="n" id="topVotes">—</div><div class="l">Votos al líder</div></div>
      <div class="stat-card"><div class="n" id="leadPct">—</div><div class="l">% del líder</div></div>
    </div>

    <div class="table-wrap">
      <div class="table-head">
        <h3>Resultados en tiempo real</h3>
        <span>Actualización automática</span>
      </div>
      <div id="resultsTable"></div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="doReveal()">🏆 Revelar Resultados</button>
      <button class="btn-secondary" onclick="doReset()">🔄 Reiniciar Votación</button>
    </div>

    <div class="log-wrap">
      <div class="log-head">📋 Registro de actividad</div>
      <div class="log" id="log"><div>▶ Sistema listo — esperando votos…</div></div>
    </div>
  </main>

  <script>
    const socket = io();
    let presentations = [], voteCounts = {};

    socket.on('state', (data) => {
      presentations = data.presentations;
      presentations.forEach(p => { voteCounts[p.id] = 0; });
      if (data.counts) Object.assign(voteCounts, data.counts);
      update(data.totalVotes);
    });

    socket.on('voteUpdate', ({ totalVotes }) => {
      update(totalVotes);
      log('🗳️ Nuevo voto recibido · Total: ' + totalVotes);
    });

    socket.on('reveal', ({ counts }) => {
      Object.assign(voteCounts, counts);
      const total = Object.values(counts).reduce((a,b)=>a+b,0);
      update(total);
      log('✅ Resultados revelados a todos los participantes');
    });

    socket.on('reset', () => {
      presentations.forEach(p => { voteCounts[p.id] = 0; });
      update(0);
      log('🔄 Votación reiniciada');
    });

    function update(total) {
      document.getElementById('totalVotes').textContent = total;
      const vals = Object.values(voteCounts);
      const max = Math.max(...vals, 0);
      document.getElementById('topVotes').textContent = max > 0 ? max : '—';
      document.getElementById('leadPct').textContent = total > 0 ? Math.round((max/total)*100) + '%' : '—';
      const sorted = [...presentations].sort((a,b)=>(voteCounts[b.id]||0)-(voteCounts[a.id]||0));
      document.getElementById('resultsTable').innerHTML = sorted.map(p => {
        const v = voteCounts[p.id] || 0;
        const pct = max > 0 ? Math.round((v/max)*100) : 0;
        return `
          <div class="row">
            <div class="em">${p.emoji}</div>
            <div class="info"><div class="t">${p.title}</div><div class="a">${p.author} · ${p.role}</div></div>
            <div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div></div>
            <div class="vnum">${v}</div>
          </div>`;
      }).join('');
    }

    function doReveal() {
      const key = document.getElementById('adminKey').value;
      if (!confirm('¿Revelar resultados a todos los participantes?')) return;
      socket.emit('reveal', { adminKey: key });
    }

    function doReset() {
      const key = document.getElementById('adminKey').value;
      if (!confirm('¿Reiniciar la votación? Se borrarán todos los votos.')) return;
      socket.emit('reset', { adminKey: key });
    }

    function log(msg) {
      const el = document.getElementById('log');
      const t = new Date().toLocaleTimeString('es');
      el.innerHTML += `<div>[${t}] ${msg}</div>`;
      el.scrollTop = el.scrollHeight;
    }
  </script>
</body>
</html>
